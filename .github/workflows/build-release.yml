name: Build & Release Firmware

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ESP32 Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install ESP32 Platform Core
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11

      - name: Install Required Libraries
        run: |
          arduino-cli lib install "WiFiManager"
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "XPT2046_Touchscreen"
          arduino-cli lib install "TFT_eSPI"

      - name: Configure TFT_eSPI for CYD (ST7789 320x240)
        run: |
          SETUP_FILE=$(find $HOME/Arduino/libraries/TFT_eSPI/User_Setups -name "Setup200_CYD_ESP32_2432S028R.h" | head -1)
          if [ -n "$SETUP_FILE" ]; then
            SELECT_FILE="$HOME/Arduino/libraries/TFT_eSPI/User_Setup_Select.h"
            sed -i 's|#include <User_Setup.h>|//#include <User_Setup.h>|g' "$SELECT_FILE"
            echo "#include <User_Setups/Setup200_CYD_ESP32_2432S028R.h>" >> "$SELECT_FILE"
          fi

      - name: Compile CYD Pixel Clock Sketch
        run: |
          arduino-cli compile --fqbn "esp32:esp32:esp32:PartitionScheme=min_spiffs" \
            --output-dir ./build \
            ./

      - name: Rename Firmware Binary
        run: |
          cp ./build/*.ino.bin ./build/firmware.bin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ./build/firmware.bin
            ./build/*.bootloader.bin
            ./build/*.partitions.bin
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
